<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-labelledby="t d">
<title id="t">Phuong Doan, Ho Chi Minh City</title>
<desc id="d">An agent query goes to jarvis, which searches a symbol index, a lexical index and a semantic index, then fuses the results by reciprocal rank fusion.</desc>
<style>
  .name { font: 500 56px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; letter-spacing: -2px; fill: #26251e; }
  .place { font: 400 21px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #6b6a61; }
  .label { font: 500 19px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #26251e; }
  .hub { font: 500 21px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #ffffff; }
  .sub { font: 400 13px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #6b6a61; }
  .card { fill: #ecebe8; stroke: #a9a8a1; stroke-width: 1; }
  .accent { fill: #2456d6; }
  .wire { fill: none; stroke: #a9a8a1; stroke-width: 1.5; }
  .pulse { fill: none; stroke: #2456d6; stroke-width: 3; stroke-linecap: round;
           stroke-dasharray: 16 200; stroke-dashoffset: 16; opacity: 0;
           animation: run 3.2s cubic-bezier(.5,0,.3,1) 3 both; }
  .in { animation: enter .7s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes run {
    0% { stroke-dashoffset: 16; opacity: 0; }
    8% { opacity: 1; }
    34% { stroke-dashoffset: -100; opacity: 1; }
    40%, 100% { stroke-dashoffset: -100; opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .in { animation: none; }
    .pulse { animation: none; opacity: 0; }
  }
</style>
<rect width="880" height="440" rx="18" fill="#dfdedb"/>
